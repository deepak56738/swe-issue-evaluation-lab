[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swe-issue-evaluation-lab"
version = "1.0.0"
description = "A reproducible issue-to-fix software engineering evaluation workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Deepak" }]
dependencies = ["pytest>=8.4,<9"]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
evaluate-scenarios = "swe_issue_lab.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_issue_lab"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["swe_issue_lab"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["swe_issue_lab"]
